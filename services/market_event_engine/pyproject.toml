[project]
name = "event-driven-market-intelligence"
version = "0.1.0"
description = "Async event-driven market news intelligence service"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "arq>=0.26.1",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "pydantic>=2.8.0",
  "pydantic-settings>=2.4.0",
  "redis>=5.0.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
ml = [
  "natasha>=1.6.0",
  "sentence-transformers>=3.0.0",
  "scikit-learn>=1.5.0",
  "spacy>=3.7.0",
]
postgres = [
  "asyncpg>=0.29.0",
]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
]

[dependency-groups]
dev = [
  "pytest>=8.2.0",
  "pytest-asyncio>=0.23.0",
  "ruff>=0.15.12",
]

[project.scripts]
edmi-api = "edmi.api.main:run"
edmi-ingest = "edmi.ingestion.cli:main"
edmi-pipeline = "edmi.integration.cli:main"
edmi-export-events = "edmi.integration.export_pipeline:main"
edmi-rag-build = "edmi.rag.csv_rag:build_main"
edmi-rag-query = "edmi.rag.csv_rag:query_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edmi"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.uv]
package = true
