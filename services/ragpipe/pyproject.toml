[project]
name = "tradematic-ragpipe"
version = "0.1.0"
description = "Hybrid BM25+FAISS RAG service for Tradematic news"
requires-python = ">=3.10,<3.11"
dependencies = [
  "chromadb>=0.5.0",
  "faiss-cpu>=1.7.4",
  "httpx>=0.27.0",
  "rank-bm25>=0.2.2",
  "sentence-transformers>=3.0.0",
]

[project.scripts]
edmi-ragpipe-build = "tradematic_ragpipe.core:build_main"
edmi-ragpipe-query = "tradematic_ragpipe.core:query_main"
edmi-ragpipe-chat = "tradematic_ragpipe.core:chat_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tradematic_ragpipe"]

[tool.ruff]
line-length = 120
target-version = "py310"
