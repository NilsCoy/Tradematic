<button class="rag-chat-toggle" type="button" aria-label="Открыть AI-чат" title="AI-чат">
    <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M21 12a8 8 0 0 1-8 8H7l-4 3v-6.1A7.8 7.8 0 0 1 2 12a8 8 0 0 1 8-8h3a8 8 0 0 1 8 8Z"></path>
        <path d="M8 11h8M8 15h5"></path>
    </svg>
</button>

<section class="rag-chat-box" aria-label="Tradematic AI чат" hidden>
    <header class="rag-chat-header">
        <div>
            <strong>Tradematic AI</strong>
            <span>RAG по новостям и событиям</span>
        </div>
        <button class="rag-chat-close" type="button" aria-label="Закрыть чат">×</button>
    </header>
    <div class="rag-chat-messages" aria-live="polite"></div>
    <form class="rag-chat-form" data-endpoint="{% url 'chat_api' %}">
        {% csrf_token %}
        <input class="rag-chat-input" type="text" name="message" placeholder="Спросите про рынок..." autocomplete="off" />
        <button class="rag-chat-send" type="submit" aria-label="Отправить">
            <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="m4 12 16-8-5 16-3-7-8-1Z"></path>
            </svg>
        </button>
    </form>
</section>
